services:
  redis:
    image: redis/redis-stack-server:7.4.0-v2
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_volume:/data
    networks:
      - redis_network

volumes:
  redis_volume:
    name: "redis_volume"

networks:
  redis_network:
    name: "redis_network"
    driver: bridge
